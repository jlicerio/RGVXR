<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title id="pageTitle">CarrouselXR — AR Gallery</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
    <script src="js/platform.js"></script>
    <script src="js/xr-simulator.js"></script>
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        
        :root {
            --panel-bg: rgba(12,12,12,0.72);
            --panel-border: rgba(255,255,255,0.07);
            --text-primary: #fff;
            --text-muted: rgba(255,255,255,0.5);
            --accent: #fff;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: var(--text-primary);
            overflow: hidden;
            height: 100dvh; width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        
        model-viewer {
            width: 100%; height: 100%;
            --poster-color: #000;
            --progress-bar-color: #fff;
            --progress-bar-height: 2px;
            transition: opacity 0.3s;
        }
        
        /* ══════ LOADING / ERROR STATES ══════ */
        .loading-screen {
            position: fixed; inset: 0; z-index: 50;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .loading-screen.done { opacity: 0; }
        
        .loading-spinner {
            width: 36px; height: 36px;
            border: 2.5px solid rgba(255,255,255,0.12);
            border-top-color: rgba(255,255,255,0.8);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        
        .loading-label { font-size: 13px; opacity: 0.5; letter-spacing: 0.3px; }
        
        .error-state {
            position: fixed; inset: 0; z-index: 50;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; gap: 12px;
        }
        .error-state.show { display: flex; }
        .error-state .err-icon { font-size: 40px; opacity: 0.6; }
        .error-state .err-msg { font-size: 14px; opacity: 0.6; text-align: center; max-width: 280px; }
        .error-state .retry-btn {
            background: rgba(255,255,255,0.1); color: #fff;
            border: 1px solid rgba(255,255,255,0.2); padding: 10px 24px;
            border-radius: 20px; font-size: 13px; cursor: pointer;
        }
        
        /* ══════ CAROUSEL BUTTONS ══════ */
        .carousel-btn {
            position: fixed; top: 50%; transform: translateY(-50%);
            z-index: 20; width: 44px; height: 44px; border-radius: 50%;
            background: rgba(20,20,20,0.5);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.15s;
            opacity: 0.45;
            will-change: opacity;
        }
        .carousel-btn:hover, .carousel-btn:focus-visible { opacity: 0.9; background: rgba(40,40,40,0.6); }
        .carousel-btn:active { transform: translateY(-50%) scale(0.93); }
        .carousel-btn.prev { left: 12px; }
        .carousel-btn.next { right: 12px; }
        .carousel-btn svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2; fill: none; }
        
        /* ══════ LOCATION BAR ══════ */
        .loc-bar {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 25; display: none; align-items: center; gap: 8px;
            background: var(--panel-bg); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border); border-radius: 20px;
            padding: 6px 14px; font-size: 12px;
        }
        .loc-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .loc-dot.ready { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.5); }
        .loc-dot.off { background: rgba(255,255,255,0.25); }
        .loc-dot.searching { background: #fbbf24; animation: pulse 1.5s ease infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .loc-text { opacity: 0.7; white-space: nowrap; }
        .demo-btn {
            background: none; border: 1px solid rgba(255,255,255,0.18);
            color: var(--text-muted); padding: 2px 8px; border-radius: 10px;
            font-size: 10px; cursor: pointer; transition: all 0.2s;
        }
        .demo-btn.on { border-color: rgba(74,222,128,0.5); color: #4ade80; }
        
        /* ══════ DOT INDICATORS ══════ */
        .dots {
            position: fixed; bottom: 116px; left: 50%; transform: translateX(-50%);
            z-index: 20; display: flex; gap: 8px;
        }
        .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: rgba(255,255,255,0.3); cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .dot.active { background: #fff; transform: scale(1.5); }
        .dot.locked { background: rgba(255,255,255,0.1); cursor: default; }
        
        /* ══════ INFO PANEL ══════ */
        .info-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            max-width: 480px; width: calc(100% - 32px);
            background: var(--panel-bg); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 16px; padding: 14px 18px; z-index: 20;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: auto;
        }
        .info-panel.ar { opacity: 0.15; }
        
        .info-top {
            display: flex; justify-content: space-between;
            align-items: flex-start; gap: 8px;
        }
        .info-title {
            font-size: 16px; font-weight: 600; letter-spacing: 0.1px;
            line-height: 1.3; flex: 1;
        }
        .info-counter {
            font-size: 11px; opacity: 0.35; white-space: nowrap; padding-top: 3px;
            font-variant-numeric: tabular-nums;
        }
        .info-desc {
            font-size: 12.5px; line-height: 1.5; opacity: 0.65;
            margin-top: 6px; max-height: 44px; overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .info-desc.open { max-height: 600px; }
        .info-expand {
            margin-top: 6px; font-size: 11px; opacity: 0.35;
            cursor: pointer; text-align: center; transition: opacity 0.2s;
        }
        .info-expand:hover { opacity: 0.7; }
        
        /* ══════ AR BUTTON (model-viewer managed) ══════ */
        .ar-btn {
            position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.92); color: #000; border: none;
            padding: 12px 24px; border-radius: 24px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.35);
            z-index: 5;
        }
        .ar-btn svg { width: 17px; height: 17px; }
        
        /* ══════ FOOTER LINKS ══════ */
        .footer-links {
            position: fixed; bottom: 8px; right: 12px; z-index: 20;
            display: flex; gap: 12px; font-size: 10px;
        }
        .footer-links a {
            color: rgba(255,255,255,0.35); text-decoration: none;
            transition: opacity 0.2s;
        }
        .footer-links a:hover { opacity: 0.8; }
        
        /* ══════ SWIPE HINT ══════ */
        .swipe-hint {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            z-index: 15; pointer-events: none; opacity: 0;
            font-size: 13px; color: rgba(255,255,255,0.5);
            transition: opacity 0.6s;
        }
    </style>
</head>
<body>
    <!-- ══════ LOADING SCREEN ══════ -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-label">Loading gallery</div>
    </div>
    
    <!-- ══════ ERROR STATE ══════ -->
    <div class="error-state" id="errorState">
        <div class="err-icon">⚠</div>
        <div class="err-msg" id="errMsg">Could not load projects</div>
        <button class="retry-btn" onclick="location.reload()">Retry</button>
    </div>
    
    <!-- ══════ 3D VIEWER ══════ -->
    <model-viewer
        id="viewer"
        camera-controls touch-action="pan-y"
        ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto"
        shadow-intensity="0.7" exposure="1.0" environment-image="neutral"
        auto-rotate auto-rotate-delay="2000"
        interaction-prompt="none" interpolation-decay="180"
    >
        <button slot="ar-button" class="ar-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="6" width="22" height="16" rx="2"></rect>
                <circle cx="12" cy="15" r="3"></circle>
            </svg>
            View in AR
        </button>
    </model-viewer>
    
    <!-- ══════ LOCATION BAR ══════ -->
    <div class="loc-bar" id="locBar">
        <div class="loc-dot searching" id="locDot"></div>
        <span class="loc-text" id="locText">Loading…</span>
        <button class="demo-btn on" id="demoBtn" onclick="toggleDemo()">demo on</button>
    </div>
    
    <!-- ══════ CAROUSEL BUTTONS ══════ -->
    <button class="carousel-btn prev" onclick="RGVXR.prevModel()" aria-label="Previous project">
        <svg viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20"/></svg>
    </button>
    <button class="carousel-btn next" onclick="RGVXR.nextModel()" aria-label="Next project">
        <svg viewBox="0 0 24 24"><polyline points="9,4 17,12 9,20"/></svg>
    </button>
    
    <!-- ══════ DOT INDICATORS ══════ -->
    <div class="dots" id="dots"></div>
    
    <!-- ══════ INFO PANEL ══════ -->
    <div class="info-panel" id="infoPanel">
        <div class="info-top">
            <div class="info-title" id="infoTitle">Loading…</div>
            <div class="info-counter" id="infoCounter"></div>
        </div>
        <div class="info-desc" id="infoDesc"></div>
        <div class="info-expand" id="infoExpand" onclick="toggleDesc()">Read more</div>
    </div>
    
    <!-- ══════ FOOTER ══════ -->
    <div class="footer-links">
        <a href="admin/">admin</a>
        <a href="https://github.com/jlicerio/RGVXR" target="_blank">github</a>
    </div>
    
    <div class="swipe-hint" id="swipeHint"></div>
    
    <script>
        // ── UI State ──
        let descOpen = false;
        const $ = id => document.getElementById(id);
        
        function toggleDesc() {
            descOpen = !descOpen;
            $('infoDesc').classList.toggle('open', descOpen);
            $('infoExpand').textContent = descOpen ? 'Show less' : 'Read more';
        }
        
        function toggleDemo() {
            const on = RGVXR.toggleDemoMode();
            $('demoBtn').classList.toggle('on', on);
            $('demoBtn').textContent = on ? 'demo on' : 'demo';
        }
        
        // ── Update UI from platform state ──
        function buildDots() {
            const s = RGVXR.state;
            if (!s.projects.length) return;
            const html = s.projects.map((_, i) =>
                `<div class="dot${i===0?' active':''}" onclick="RGVXR.goToModel(${i})"></div>`
            ).join('');
            $('dots').innerHTML = html;
        }
        
        function refreshDots() {
            const s = RGVXR.state;
            const all = $('dots').querySelectorAll('.dot');
            if (!all.length) { buildDots(); return; }
            all.forEach((d, i) => {
                d.classList.toggle('active', i === s.currentIdx);
                d.classList.toggle('locked', !RGVXR.isUnlocked(i));
            });
        }
        
        function refreshInfo(project) {
            $('infoTitle').textContent = project?.title || 'Untitled';
            $('infoDesc').textContent = project?.description || '';
            document.title = (project?.title || 'AR Project') + ' | RGVXR';
            
            const s = RGVXR.state;
            let ctr = `${s.currentIdx + 1}/${s.projects.length}`;
            if (project?._distance !== undefined) {
                ctr += ` · ${RGVXR.fmtDist(project._distance)}`;
                if (!RGVXR.isUnlocked(s.currentIdx)) ctr += ' 🔒';
            }
            $('infoCounter').textContent = ctr;
            
            const expand = $('infoExpand');
            expand.style.display = (project?.description || '').length > 160 ? '' : 'none';
            if (descOpen) { descOpen = false; $('infoDesc').classList.remove('open'); }
        }
        
        function refreshLocBar() {
            // GPS bar is hidden by default — only show when user explicitly enables GPS
            // and has a location fix. Demo mode keeps it hidden.
            const bar = document.getElementById('locBar');
            bar.style.display = 'none';
        }
        
        // ── Wire events ──
        let infoUpdatePending = false;
        RGVXR.on('modelChange', ({ index, project }) => {
            // Batch DOM updates to prevent layout thrashing
            if (!infoUpdatePending) {
                infoUpdatePending = true;
                requestAnimationFrame(() => {
                    refreshDots();
                    refreshInfo(project);
                    refreshLocBar();
                    infoUpdatePending = false;
                });
            }
            if (project) history.replaceState(null, '', '#' + project.id);
        });
        
        RGVXR.on('loadError', ({ message }) => {
            $('loadingScreen').classList.add('done');
            $('errorState').classList.add('show');
            $('errMsg').textContent = message || 'Could not load projects';
        });
        
        // ── model-viewer events ──
        const viewer = $('viewer');
        
        viewer.addEventListener('load', () => {
            $('loadingScreen').classList.add('done');
            RGVXR.state.loading = false;
        });
        
        viewer.addEventListener('error', () => {
            $('loadingScreen').classList.add('done');
            RGVXR.state.loading = false;
        });
        
        viewer.addEventListener('ar-status', e => {
            const panel = $('infoPanel');
            if (e.detail.status === 'session-started') {
                panel.classList.add('ar');
            } else {
                panel.classList.remove('ar');
                // Force reload to clear AR artifacts
                setTimeout(() => {
                    const s = viewer.src;
                    viewer.src = null;
                    requestAnimationFrame(() => { viewer.src = s; });
                }, 200);
            }
        });
        
        // ── Keyboard ──
        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight') RGVXR.nextModel();
            else if (e.key === 'ArrowLeft') RGVXR.prevModel();
            else if (e.key === 'i' || e.key === 'I') toggleDesc();
        });
        
        // ── Touch swipe ──
        let tx = 0, ty = 0;
        document.addEventListener('touchstart', e => {
            tx = e.touches[0].clientX; ty = e.touches[0].clientY;
        }, { passive:true });
        
        document.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - tx;
            const dy = e.changedTouches[0].clientY - ty;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                dx < 0 ? RGVXR.nextModel() : RGVXR.prevModel();
            }
        });
        
        // ── Swipe hint (show once, on mobile) ──
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            setTimeout(() => {
                const hint = $('swipeHint');
                hint.textContent = '← swipe to browse →';
                hint.style.opacity = '1';
                setTimeout(() => { hint.style.opacity = '0'; }, 3000);
            }, 2000);
        }
        
        // ── Boot ──
        RGVXR.init(viewer).then(() => {
            // Update page title from platform config
            if (RGVXR.state.config?.platform?.name) {
                document.title = RGVXR.state.config.platform.name + ' — AR Gallery';
            }
            // Build dot indicators once
            buildDots();
            // Check URL hash for direct project link
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                const idx = RGVXR.state.projects.findIndex(p => p.id === hash);
                if (idx >= 0) RGVXR.loadModel(idx, true);
            }
            refreshLocBar();
        }).catch(err => {
            console.error('Platform init failed:', err);
            $('loadingScreen').classList.add('done');
            $('errorState').classList.add('show');
            $('errMsg').textContent = err.message || 'Failed to initialize';
        });
    </script>
</body>
</html>
